syntax = "proto3";

package auction;

option go_package = "auction/proto";

service Auction {
    rpc Bid(BidRequest) returns (BidReply);
    rpc confirmWin()
}

service ReplicaManager {
    rpc Heartbeat(Nothing) returns (Nothing);
    rpc Replicate(BidRequest) returns (Acknowledgement);
}

enum Outcome {
  Fail      = 0;
  Success   = 1;
  Exception = 2;
}

message Nothing {}

message Bidder {
  int64 id = 1;
  int64 highest_bid = 2;
}

message Acknowledgement {
    Outcome outcome = 1;
    int64 timeLeft = 2;
    int64 highestBid = 3;
}

message confirmWin {
    string ClientUuid = 1
}

message BidRequest {
    string clientUuid = 1;
    int64 clientReqNum = 2;
    int64 lamport = 3;
    int64 amount = 4;
}

message HeartbeatRequest {
    int64 lamport = 1;
}

message AuctionState {
  int64 highest_bidder_id = 1;
  int64 highest_bid = 2;
  int64 end_time = 3;
  int64 lamport = 4;
}
