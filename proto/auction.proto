syntax = "proto3";

package auction;

option go_package = "auction/proto";

service Auction {
    rpc Bid(BidRequest) returns (BidReply);
}

service ReplicaManager {
    rpc Heartbeat(Nothing) returns (Nothing);
    rpc Replicate(BidRequest) returns (Acknowledgement);
}

enum Outcome {
  Fail      = 1;
  Success   = 2;
  Exception = 3;
}

message Nothing {}

message Bidder {
  int64 id = 1;
  string port = 2;
  int64 highest_bid = 3;
}

message Acknowledgement {
    string output = 1;
}

message BidRequest {
    Bidder = 1;
    int64 lamport = 4;
    int64 amount = 5;
}

message BidReply {
    Outcome outcome = 1;
}

message HeartbeatRequest {
    int64 lamport = 1;
}

message AuctionState {
  int64 highest_bidder_id = 1;
  int64 highest_bid = 2;
  int64 end_time = 3;
  map<int64, Bidder> bidders = 5;
  map<int64, bool>   seen_requests = 6;
}
