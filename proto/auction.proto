syntax = "proto3";

package auction;

option go_package = "auction/proto";

service Auction {
    rpc Bid(BidRequest) returns (BidReply);
}

service ReplicaManager {
    rpc Heartbeat(Nothing) returns (Nothing);
    rpc Replicate(BidRequest) returns (Acknowledgement);
}

message Nothing {}

message Acknowledgement {
    int64 output = 1;
}

message BidRequest {
    int64 amount = 1;
}

message BidReply {
    bool isSuccess = 1;
}