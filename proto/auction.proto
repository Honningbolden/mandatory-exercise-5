syntax = "proto3";

package auction;

option go_package = "auction/proto";

service Auction {
    rpc Bid(BidRequest) returns (BidReply);
}

service ReplicaManager {
    rpc Heartbeat(Nothing) returns (Nothing);
    rpc Replicate(BidRequest) returns (Acknowledgement);
}

enum Outcome {
  Fail      = 1;
  Success   = 2;
  Exception = 3;
}

message Nothing {}

message Acknowledgement {
    string output = 1;
    int64 lamport = 2;
}

message BidRequest {
    int64 id = 1;
    int64 lamport = 3;
    int64 amount = 2;
}

message BidReply {
    Outcome outcome = 1;
}

message HeartbeatRequest {
    int64 lamport = 1;
}